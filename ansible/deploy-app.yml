---
- name: Deploy Flask app container on Azure VM
  hosts: azure_vm
  become: true
  vars:
    app_dir: /opt/azure-monitoring-app
    image_name: azure-monitoring-app
    container_name: azure-monitoring-app
    app_port: 5000

  tasks:
    - name: Ensure app directory exists
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0755"

    - name: Install Python Docker SDK package dependencies
      ansible.builtin.apt:
        name:
          - python3-pip
          - python3-docker
        state: present
        update_cache: true

    - name: Copy application source file
      ansible.builtin.copy:
        src: ../app/app.py
        dest: "{{ app_dir }}/app.py"
        mode: "0644"

    - name: Copy requirements file
      ansible.builtin.copy:
        src: ../app/requirements.txt
        dest: "{{ app_dir }}/requirements.txt"
        mode: "0644"

    - name: Copy Dockerfile
      ansible.builtin.copy:
        src: ../app/Dockerfile
        dest: "{{ app_dir }}/Dockerfile"
        mode: "0644"

    - name: Stop and remove old app container if present
      community.docker.docker_container:
        name: "{{ container_name }}"
        state: absent
      ignore_errors: true

    - name: Build fresh app image on VM
      community.docker.docker_image:
        name: "{{ image_name }}"
        tag: latest
        source: build
        build:
          path: "{{ app_dir }}"

    - name: Run app container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}:latest"
        state: started
        restart_policy: always
        ports:
          - "{{ app_port }}:5000"

    - name: Verify health endpoint from VM
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ app_port }}/health"
        method: GET
        status_code: 200
      register: health_result

    - name: Show health check response
      ansible.builtin.debug:
        var: health_result.json
