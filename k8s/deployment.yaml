apiVersion: apps/v1
kind: Deployment
metadata:
  name: azure-monitoring-app
  labels:
    app: azure-monitoring-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: azure-monitoring-app
  template:
    metadata:
      labels:
        app: azure-monitoring-app
    spec:
      containers:
      - name: azure-monitoring-app
        image: azure-monitoring-app:v1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
